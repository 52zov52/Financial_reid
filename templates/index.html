{% extends "base.html" %}

{% block title %}Финансовый Рейд{% endblock %}

{% block content %}
<div class="auth-container">
    <!-- Логотип и название -->
    <div class="auth-header">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Финансовый Рейд" class="auth-logo">
        <h1 class="auth-title">Финансовый Рейд</h1>
        <p class="auth-subtitle">Обучение финансовой грамотности через игру</p>
    </div>

    <!-- Форма для обычного пользователя -->
    <div class="auth-card">
        <form method="POST" action="{{ url_for('quick_start') }}" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    Ваш никнейм
                </label>
                <input type="text" id="username" name="username" class="form-control" 
                       placeholder="Введите имя" required minlength="3" maxlength="20"
                       pattern="[A-Za-zА-Яа-я0-9_]+">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                Начать игру
            </button>
        </form>

        <!-- Ссылка для входа админа -->
        <div class="auth-footer">
            <a href="{{ url_for('admin_login') }}" class="admin-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                Войти как админ
            </a>
        </div>
    </div>

    <!-- Дополнительная информация -->
    <div class="auth-info">
        <div class="info-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>6 интерактивных станций</span>
        </div>
        <div class="info-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <span>Финансовая грамотность</span>
        </div>
        <div class="info-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
            </svg>
            <span>Прогресс и достижения</span>
        </div>
    </div>
</div>

<style>
.auth-container {
    max-width: 500px;
    margin: 0 auto;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin-bottom: 1rem;
    filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
}

.auth-title {
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary-color);
    margin-bottom: 0.5rem;
}

.auth-subtitle {
    color: var(--text-secondary);
    font-size: 1rem;
}

.auth-card {
    background: var(--bg-darker);
    border-radius: var(--border-radius);
    padding: 2rem;
    width: 100%;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0, 217, 255, 0.1);
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(0, 217, 255, 0.1);
}

.admin-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.875rem;
    transition: var(--transition);
    padding: 0.5rem;
    border-radius: var(--border-radius);
}

.admin-link:hover {
    color: var(--primary-color);
    background: rgba(0, 217, 255, 0.1);
}

.admin-link svg {
    width: 16px;
    height: 16px;
}

.auth-info {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 2rem;
    width: 100%;
}

.info-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--text-secondary);
    font-size: 0.875rem;
}

.info-item svg {
    width: 20px;
    height: 20px;
    color: var(--primary-color);
    flex-shrink: 0;
}

@media (max-width: 480px) {
    .auth-container {
        padding: 1rem;
    }
    
    .auth-title {
        font-size: 1.5rem;
    }
    
    .auth-card {
        padding: 1.5rem;
    }
}
</style>
{% endblock %}
