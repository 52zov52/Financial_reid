{% extends "base.html" %}

{% block title %}Вход администратора{% endblock %}

{% block content %}
<div class="auth-container">
    <!-- Логотип и название -->
    <div class="auth-header">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Финансовый Рейд" class="auth-logo">
        <h1 class="auth-title">Админ-панель</h1>
        <p class="auth-subtitle">Вход для администратора</p>
    </div>

    <!-- Форма входа админа -->
    <div class="auth-card">
        <form method="POST" action="{{ url_for('admin_auth') }}" class="auth-form">
            <div class="form-group">
                <label for="admin_username" class="form-label">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    Имя пользователя
                </label>
                <input type="text" id="admin_username" name="username" class="form-control" 
                       placeholder="admin" required>
            </div>

            <div class="form-group">
                <label for="admin_password" class="form-label">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    Пароль
                </label>
                <input type="password" id="admin_password" name="password" class="form-control" 
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
                Войти
            </button>
        </form>

        <!-- Ссылка назад -->
        <div class="auth-footer">
            <a href="{{ url_for('index') }}" class="admin-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Вернуться на главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
