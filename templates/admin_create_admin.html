{% extends "base.html" %}
{% block title %}Создать админа{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto; padding: 40px;">
    <h1 style="color: #00d9ff; margin-bottom: 30px; display: flex; align-items: center; gap: 12px;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 32px; height: 32px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
        Создать администратора
    </h1>

    <form method="POST" style="background: #0f3460; padding: 25px; border-radius: 15px;">
        <div class="form-group">
            <label style="color: #aaa; display: block; margin-bottom: 5px;">Имя пользователя</label>
            <input type="text" name="username" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1a1a2e; background: #1a1a2e; color: white;">
        </div>

        <div class="form-group">
            <label style="color: #aaa; display: block; margin-bottom: 5px;">Пароль (мин. 6 символов)</label>
            <input type="password" name="password" required minlength="6" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1a1a2e; background: #1a1a2e; color: white;">
        </div>

        <button type="submit" style="background: #00b894; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            Создать
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('admin_admins') }}" style="color: #00d9ff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Назад
        </a>
    </div>
</div>
{% endblock %}
