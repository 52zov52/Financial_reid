{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 50px auto; padding: 40px;">
    <h2 style="color: #00d9ff; text-align: center; margin-bottom: 30px;">Вход в систему</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="username" class="form-label">Имя пользователя</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">
            Войти
        </button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('index') }}" style="color: #00d9ff; text-decoration: none;">
            ← На главную
        </a>
    </div>
</div>
{% endblock %}
