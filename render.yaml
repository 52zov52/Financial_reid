services:
  - type: web
    name: financial-raid
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FINANCIAL_RAID_ADMIN_PASSWORD
        value: FinRaid_Admin!@
      - key: PYTHON_VERSION
        value: 3.10.0